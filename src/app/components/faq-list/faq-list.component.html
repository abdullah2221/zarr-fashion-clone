@if (items().length) {
  <section class="faq-list reveal-section">
    <div class="faq-list__container">
      @if (eyebrow() || title()) {
        <div class="faq-list__intro">
          @if (eyebrow()) { <span class="eyebrow">{{ eyebrow() }}</span> }
          @if (title()) { <h2>{{ title() }}</h2> }
        </div>
      }
      <div class="faq-list__grid">
        @for (item of items(); track item.id) {
          <article class="faq-list__card">
            <h3>{{ item.question }}</h3>
            <p>{{ item.answer }}</p>
          </article>
        }
      </div>
    </div>
  </section>
}
