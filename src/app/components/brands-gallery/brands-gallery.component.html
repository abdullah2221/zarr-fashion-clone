<section class="brands">
  <div class="brands__container">
    <h2 class="brands__title">Featured Brands</h2>

    <div class="brands__list">
      @for (brand of content().brands; track brand.name) {
        <span class="brands__logo brands__logo--{{ brand.styleKey }}">{{ brand.name }}</span>
      }
    </div>
  </div>
</section>

<section class="stats">
  <div class="stats__bg">
    <img [src]="statsBackgroundUrl()" [alt]="content().statsBackgroundAlt" class="stats__image">
  </div>

  <div class="stats__content">
    <h2 class="stats__subtitle">{{ content().statsEyebrow }}</h2>
    @for (item of content().statsItems; track item.label) {
      <div class="stats__number">
        {{ item.value }}
      </div>
      <h3 class="stats__title">{{ item.label }}</h3>
    }
    <div class="stats__divider"></div>
  </div>
</section>
