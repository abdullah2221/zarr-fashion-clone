@if (routerLink(); as link) {
  <a
    [routerLink]="link"
    class="admin-action-button"
    [class.admin-action-button--show-label]="showLabel()"
    [class.admin-action-button--soft]="appearance() === 'soft'"
    [class.admin-action-button--solid]="appearance() === 'solid'"
    [class.admin-action-button--touch]="size() === 'touch'"
    [class.is-success]="tone() === 'success'"
    [class.is-danger]="tone() === 'danger'"
    [class.is-warning]="tone() === 'warning'"
    [attr.aria-label]="ariaLabel() || label()"
    [attr.title]="title() || label()"
  >
    <mat-icon>{{ icon() }}</mat-icon>
    @if (showLabel()) {
      <span>{{ label() }}</span>
    } @else {
      <span class="admin-action-button__sr-only">{{ label() }}</span>
    }
  </a>
} @else {
  <button
    [type]="type()"
    class="admin-action-button"
    [class.admin-action-button--show-label]="showLabel()"
    [class.admin-action-button--soft]="appearance() === 'soft'"
    [class.admin-action-button--solid]="appearance() === 'solid'"
    [class.admin-action-button--touch]="size() === 'touch'"
    [class.is-success]="tone() === 'success'"
    [class.is-danger]="tone() === 'danger'"
    [class.is-warning]="tone() === 'warning'"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel() || label()"
    [attr.title]="title() || label()"
    (click)="pressed.emit()"
  >
    <mat-icon>{{ icon() }}</mat-icon>
    @if (showLabel()) {
      <span>{{ label() }}</span>
    } @else {
      <span class="admin-action-button__sr-only">{{ label() }}</span>
    }
  </button>
}
